spring.application.name=footmarket-api

# ===============================
# Configurações do Datasource
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/footmarket?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# Configurações do Flyway
# As tabelas são criadas pelas migrations em src/main/resources/db/migration
# ===============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===============================
# Configurações do JPA / Hibernate
# Com o Flyway, o Hibernate só confere (validate) e nunca altera o banco.
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Dialect do MySQL (Hibernate 6.x, usado pelo Spring Boot 3.5)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# Configurações do HikariCP
# ===============================
spring.datasource.hikari.pool-name=HikariPool-1
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# ===============================
# Configurações de Logging
# (desligar antes de entregar: o diferencial de logs pede uma linha por requisição)
# ===============================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE