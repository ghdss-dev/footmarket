spring.application.name=footmarket-api

# ===============================
# Configurações do Datasource
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/footmarket?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# Configurações do Flyway
# ===============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# CORREÇÃO 1: Garante que o Flyway rode ANTES de qualquer validação do JPA/Hibernate
spring.flyway.baseline-on-migrate=true

# ===============================
# Configurações do JPA / Hibernate
# ===============================
# CORREÇÃO 2: Altere temporariamente para 'none' para testar se o Flyway cria as tabelas.
# Após o banco ser criado com sucesso pelo Flyway, você pode voltar para 'validate'.
spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# CORREÇÃO 3: Dialeto atualizado para o MySQL 8+ (A classe MySQLDialect genérica perdeu suporte em versões novas do Hibernate 6)
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ===============================
# Configurações do HikariCP
# ===============================
spring.datasource.hikari.pool-name=HikariPool-1
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
spring.jackson.mapper.allow-coercion-of-scalars=false

# ===============================
# Configurações de Logging
# ===============================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# ADICIONADO: Log do Flyway para você ver no console se ele está achandoseu arquivo SQL
logging.level.org.flywaydb=DEBUG
